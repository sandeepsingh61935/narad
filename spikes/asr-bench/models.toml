# Phase 0 ASR models (ROADMAP item 4). Archives from:
# https://github.com/k2-fsa/sherpa-onnx/releases/tag/asr-models
#
# After `scripts/download-models.sh`, each archive extracts to `models/<extract_dir>/`.

[[model]]
id = "parakeet-tdt-0.6b-v2-int8"
label = "Parakeet TDT 0.6B int8"
archive = "sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2"
extract_dir = "sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8"
kind = "nemo_transducer"
# encoder.int8.onnx, decoder.int8.onnx, joiner.int8.onnx, tokens.txt

[[model]]
id = "parakeet-ctc-110m-int8"
label = "Parakeet CTC 110M int8"
archive = "sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8.tar.bz2"
extract_dir = "sherpa-onnx-nemo-parakeet_tdt_ctc_110m-en-36000-int8"
kind = "nemo_ctc"
# model.int8.onnx (or model.onnx), tokens.txt

[[model]]
id = "moonshine-base-en-int8"
label = "Moonshine base en int8"
archive = "sherpa-onnx-moonshine-base-en-int8.tar.bz2"
extract_dir = "sherpa-onnx-moonshine-base-en-int8"
kind = "moonshine_v1"
# preprocess.onnx, encode*.onnx, *decode*.onnx, tokens.txt

[[model]]
id = "whisper-small-en"
label = "Whisper small.en"
