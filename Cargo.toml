[workspace]
resolver = "2"
members = [
  "crates/naradd",
  "crates/narad-core",
  "crates/narad-dbus",
  "crates/narad-cli",
  "spikes/hotkeys",
  "spikes/insert",
  "spikes/asr-bench",
]
default-members = [
  "crates/naradd",
  "crates/narad-core",
  "crates/narad-dbus",
  "crates/narad-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.1"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
zbus = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
