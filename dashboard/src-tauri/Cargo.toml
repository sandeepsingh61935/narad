# Standalone package (not a root workspace member); path-deps into ../../crates.
[workspace]

[package]
name = "dashboard"
version = "0.1.0"
description = "Narad dashboard (History shell)"
authors = ["Narad"]
edition = "2021"
license = "MIT"

[lib]
name = "dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
narad-dbus = { path = "../../crates/narad-dbus" }
zbus = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
